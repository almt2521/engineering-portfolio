<!--
  ROUGH STONE. Two layers of random noise are used as a bumpy surface, then lit from the upper left so it looks like real rock with hills and dents. Used on the wall and on all dark stone (nav bar, labels, footer).

  HOW IT IS USED: style.css lists this file in the "TEXTURES" section near the top,
  and layers it on the wall, panels, and dark stone. It is a picture the browser draws,
  so there is nothing here you need to edit. To make a texture stronger or weaker,
  change its size or blending in style.css instead of editing this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
<filter id="s" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="7" stitchTiles="stitch" result="a"/>
<feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="3" stitchTiles="stitch" result="b"/>
<feComposite in="a" in2="b" operator="arithmetic" k1="0" k2="0.75" k3="0.35" k4="0" result="h"/>
<feDiffuseLighting in="h" lighting-color="#ffffff" surfaceScale="4" diffuseConstant="1">
<feDistantLight azimuth="235" elevation="52"/>
</feDiffuseLighting>
</filter>
<rect width="100%" height="100%" filter="url(#s)"/>
</svg>
