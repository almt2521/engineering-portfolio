<!--
  WATER STAINS. Dark vertical streaks, like rain running down a concrete wall over many years. Used on the wall and fading in from the bottom of each panel.

  HOW IT IS USED: style.css lists this file in the "TEXTURES" section near the top,
  and layers it on the wall, panels, and dark stone. It is a picture the browser draws,
  so there is nothing here you need to edit. To make a texture stronger or weaker,
  change its size or blending in style.css instead of editing this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
<filter id="t" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.07 0.004" numOctaves="3" seed="5" stitchTiles="stitch"/>
<feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 2.4 -1.1"/>
</filter>
<rect width="100%" height="100%" filter="url(#t)"/>
</svg>
